<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Admin</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="./admin.css" rel="stylesheet" />
  </head>
  <body>
    <div id="login-view" class="login-wrapper">
      <div class="card login-card">
        <div class="card-body">
          <h4 class="card-title mb-4">Stream Admin</h4>
          <form id="login-form">
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                class="form-control"
                required
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <div id="login-error" class="text-danger mt-2" hidden></div>
          </form>
        </div>
      </div>
    </div>

    <div id="dashboard-view" hidden>
      <nav class="navbar navbar-dark bg-dark">
        <span class="navbar-brand">Stream Admin</span>
        <div>
          <a href="../index.html" class="btn btn-sm btn-outline-light mr-2">View Stream</a>
          <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
        </div>
      </nav>

      <div class="container-fluid py-4">
        <ul class="nav nav-tabs mb-4" id="admin-tabs">
          <li class="nav-item">
            <a class="nav-link active" data-tab="settings" href="#">Scrolling Text & Settings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="streams" href="#">Stream Sources</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-tab="users" href="#">Chat Users</a>
          </li>
        </ul>

        <div id="tab-settings" class="tab-panel">
          <div class="card">
            <div class="card-body">
              <form id="settings-form">
                <div class="form-group">
                  <label for="scrolling-text">Scrolling Text</label>
                  <textarea
                    id="scrolling-text"
                    class="form-control"
                    rows="4"
                    required
                  ></textarea>
                </div>
                <div class="form-group">
                  <label for="default-avatar">Default Avatar URL</label>
                  <input
                    type="url"
                    id="default-avatar"
                    class="form-control"
                    required
                  />
                  <small class="form-text text-muted">
                    Used when adding chat users with name and email only.
                  </small>
                </div>
                <div class="form-group">
                  <label for="new-password">New Admin Password (optional)</label>
                  <input
                    type="password"
                    id="new-password"
                    class="form-control"
                    autocomplete="new-password"
                  />
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
              </form>
            </div>
          </div>
        </div>

        <div id="tab-streams" class="tab-panel" hidden>
          <div class="card mb-4">
            <div class="card-header">Add Stream Source</div>
            <div class="card-body">
              <form id="stream-form" class="form-row">
                <div class="form-group col-md-3">
                  <input
                    type="text"
                    id="stream-name"
                    class="form-control"
                    placeholder="Name"
                    required
                  />
                </div>
                <div class="form-group col-md-4">
                  <input
                    type="url"
                    id="stream-dash"
                    class="form-control"
                    placeholder="DASH URL (.mpd)"
                  />
                </div>
                <div class="form-group col-md-4">
                  <input
                    type="url"
                    id="stream-hls"
                    class="form-control"
                    placeholder="HLS URL (.m3u8)"
                  />
                </div>
                <div class="form-group col-md-1">
                  <button type="submit" class="btn btn-primary btn-block">Add</button>
                </div>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-body p-0">
              <table class="table table-dark table-hover mb-0">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>DASH URL</th>
                    <th>HLS URL</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="streams-table"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="tab-users" class="tab-panel" hidden>
          <div class="card mb-4">
            <div class="card-header">Add Chat User</div>
            <div class="card-body">
              <form id="user-form" class="form-row align-items-end">
                <div class="form-group col-md-4">
                  <label for="user-name">Name</label>
                  <input
                    type="text"
                    id="user-name"
                    class="form-control"
                    required
                  />
                </div>
                <div class="form-group col-md-4">
                  <label for="user-email">Email</label>
                  <input
                    type="email"
                    id="user-email"
                    class="form-control"
                    placeholder="user@example.com"
                    required
                  />
                </div>
                <div class="form-group col-md-3">
                  <label for="user-pic">Avatar URL (optional)</label>
                  <input type="url" id="user-pic" class="form-control" />
                </div>
                <div class="form-group col-md-1">
                  <button type="submit" class="btn btn-primary btn-block">Add</button>
                </div>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-body p-0">
              <table class="table table-dark table-hover mb-0">
                <thead>
                  <tr>
                    <th></th>
                    <th>Name</th>
                    <th>Email</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="users-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./admin.js"></script>
  </body>
</html>
